<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Verify your email — BlogApp</title>
</head>
<body style="margin:0;padding:0;background:#fafafa;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">

    <!-- Outer wrapper -->
    <table width="100%" cellpadding="0" cellspacing="0" role="presentation"
           style="background:#fafafa;padding:48px 16px;">
        <tr>
            <td align="center">

                <!-- Card -->
                <table width="100%" cellpadding="0" cellspacing="0" role="presentation"
                       style="max-width:520px;background:#ffffff;border:1px solid #e4e4e7;border-radius:14px;overflow:hidden;">

                    <!-- Header -->
                    <tr>
                        <td style="padding:32px 40px 24px;border-bottom:1px solid #f0f0f0;">
                            <span style="font-size:15px;font-weight:700;letter-spacing:-0.3px;color:#18181b;">BlogApp</span>
                        </td>
                    </tr>

                    <!-- Body -->
                    <tr>
                        <td style="padding:36px 40px 28px;">
                            <h1 style="margin:0 0 10px;font-size:20px;font-weight:700;letter-spacing:-0.5px;color:#18181b;">
                                {{HEADING}}
                            </h1>
                            <p style="margin:0 0 28px;font-size:14px;line-height:1.7;color:#52525b;">
                                {{SUBTEXT}}
                            </p>

                            <!-- CTA button -->
                            <table cellpadding="0" cellspacing="0" role="presentation">
                                <tr>
                                    <td style="border-radius:7px;background:#18181b;">
                                        <a href="{{TOKEN_URL}}"
                                           style="display:inline-block;padding:11px 24px;font-size:14px;font-weight:500;color:#ffffff;text-decoration:none;letter-spacing:-0.1px;">
                                            {{CTA_TEXT}}
                                        </a>
                                    </td>
                                </tr>
                            </table>

                            <!-- Fallback link -->
                            <p style="margin:24px 0 0;font-size:12px;color:#71717a;line-height:1.6;">
                                Or copy and paste this link into your browser:<br/>
                                <a href="{{TOKEN_URL}}" style="color:#18181b;word-break:break-all;">{{TOKEN_URL}}</a>
                            </p>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding:20px 40px 28px;border-top:1px solid #f0f0f0;">
                            <p style="margin:0;font-size:12px;color:#a1a1aa;line-height:1.6;">
                                If you did not request this email, you can safely ignore it.
                                This link will expire automatically.
                            </p>
                        </td>
                    </tr>

                </table>

                <!-- Below-card note -->
                <p style="margin:20px 0 0;font-size:12px;color:#a1a1aa;">
                    BlogApp &mdash; sent to {{RECIPIENT_EMAIL}}
                </p>

            </td>
        </tr>
    </table>

</body>
</html>
